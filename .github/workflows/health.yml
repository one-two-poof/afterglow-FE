# 백엔드 합성 헬스체크.
#
# 실사용자 트래픽 없이도 서버 상태를 알기 위해 주기적으로 엔드포인트를 두드리고
# 결과를 status-data 브랜치에 JSONL로 남긴다. 상태 페이지가 그 기록을 읽어 그린다.
#
# 프로브가 하나라도 실패하면 잡을 실패시킨다 — 스케줄 워크플로가 실패하면 GitHub이
# 저장소 소유자에게 메일을 보내므로, 별도 알림 서비스 없이 이게 1차 경보가 된다.
name: Health check

on:
  schedule:
    # 30분 간격이되 정시를 피한다. GitHub의 스케줄 큐는 매시 0분에 몰려서, "*/30"처럼
    # 정각에 걸린 작업은 지연되거나 통째로 누락되는 일이 잦다(실측: 도입 직후 4시간
    # 넘게 한 번도 실행되지 않았다). 몇 분 비켜 두면 그 봉우리를 피한다.
    #
    # 그래도 누락은 남는다 — 상태 페이지가 마지막 기록이 90분보다 오래되면 스스로
    # "점검 중단"을 띄우므로, 멈춘 것을 정상으로 오해할 일은 없다.
    - cron: "7,37 * * * *"
  workflow_dispatch:

# 같은 브랜치에 기록을 밀어 넣으므로 두 실행이 겹치면 푸시가 충돌한다.
concurrency:
  group: health-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # status-data는 코드가 없는 기록 전용 브랜치다. 없으면 이번 푸시로 만들어진다.
      - name: status-data 브랜치 준비
        uses: ./.github/actions/status-data-checkout
        with:
          token: ${{ github.token }}

      - name: 프로브 실행
        id: probe
        continue-on-error: true
        run: node scripts/health-check.mjs --out .status-data

      # 실패한 실행의 기록도 남겨야 하므로 커밋은 프로브 결과와 무관하게 돈다.
      - name: 기록 커밋
        uses: ./.github/actions/status-data-commit
        with:
          message: "chore(status): 헬스체크 ${{ github.run_number }}"

      - name: 프로브 실패 시 잡 실패 처리
        if: steps.probe.outcome == 'failure'
        run: |
          echo "::error::헬스체크 프로브가 실패했다. 상태 페이지와 위 로그를 확인할 것."
          exit 1

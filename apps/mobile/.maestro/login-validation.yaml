# 로그인 유효성 검증 E2E
# 게스트 상태 보장 → "로그인하기" → 로그인 화면 →
# 빈 값/잘못된 이메일 제출 시 에러 문구 확인. 백엔드/계정 불필요.
# 로그인 입력·버튼은 testID(id:, 정확 매칭), 탭·설정행은 조합 라벨이라 부분일치 정규식(.*...*).
#
# 참고: launchApp에 clearState를 쓰지 않는 이유와 게스트 상태를 만드는 방법은
#       subflows/ensure-logged-out.yaml 주석 참고.
appId: com.dunaduneos.afterglow
---
- launchApp # clearState 없이 재실행 → dev-client가 마지막 Metro URL로 자동 재연결
# 탭 바만 보고 진행하면 아직 JS가 바쁜 상태라 탭 탭이 씹힌다.
# 홈 FAB(home.plan.open)까지 기다려 첫 화면 렌더가 끝난 걸 확인한다.
- extendedWaitUntil:
    visible: ".*여행 계획 짜기.*"
    timeout: 90000

# 0) 미로그인 상태 보장 (끝나면 "내 정보" 탭 + 게스트 화면)
- runFlow: subflows/ensure-logged-out.yaml

# 1) 게스트 내 정보 → "로그인하기" → 로그인 화면
- takeScreenshot: "01-my-info-guest"
- tapOn: ".*로그인하기.*"
# 화면 전환 지연을 흡수 (assertVisible 기본 타임아웃보다 넉넉히)
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000
- assertVisible:
    id: "login-password-input"
- takeScreenshot: "02-login-screen"

# 2) 빈 값 제출 → 필수 입력 에러
- tapOn:
    id: "login-submit-button"
- assertVisible: "이메일을 입력해주세요."
- assertVisible: "비밀번호를 입력해주세요."
- takeScreenshot: "03-empty-errors"

# 3) 잘못된 이메일 형식 → 형식 에러
- tapOn:
    id: "login-email-input"
- inputText: "not-an-email"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: "올바른 이메일 형식이 아니에요."
- takeScreenshot: "04-invalid-email-error"

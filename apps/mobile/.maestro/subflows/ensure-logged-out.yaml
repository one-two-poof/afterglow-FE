# 공용 서브플로우: 미로그인(게스트) 상태 보장.
#
# 인증 토큰은 expo-secure-store(iOS Keychain)에 저장돼 Maestro clearState로는 안 지워진다.
# (게다가 clearState는 dev-client가 기억하는 Metro URL까지 지워 dev 런처로 튄다)
# → 상태 초기화가 아니라 UI 로그아웃으로 게스트 상태를 만든다.
#
# 호출 측 전제: 앱이 실행돼 탭 바가 보이는 상태.
# 종료 시 상태: "내 정보" 탭 + 게스트("로그인하기" 행이 보임).
#
# 셀렉터 주의: 탭·설정행은 접근성 라벨에 장식이 붙거나(게스트 "내 정보, tab, 3 of 3" /
#             로그인 "... 4 of 4") 제목+설명이 한 라벨로 합쳐져 정확 매칭이 안 된다
#             → 부분일치 정규식(.*...*) 사용.
appId: com.dunaduneos.afterglow
tags:
  - subflow
---
# 콜드 스타트 직후에는 탭 탭이 씹힌다(Maestro는 COMPLETED로 보고하지만 화면이 안 바뀜).
# 앱 재실행 후 JS 번들을 다시 받는 동안 특히 잦아서, 이동이 확인될 때까지 재시도한다.
#
# my-page 로딩(skeleton) 대기: "언어 설정" 행은 로그인/게스트 양쪽에 항상 있어 로딩 완료 신호로 쓴다.
# (이 대기가 없으면 로딩 중에 "로그아웃" 체크가 SKIP돼 로그인 상태가 유지된다)
- retry:
    maxRetries: 3
    commands:
      - tapOn: ".*내 정보.*"
      - extendedWaitUntil:
          visible: ".*언어 설정.*"
          timeout: 15000
- runFlow:
    when:
      visible: ".*로그아웃.*"
    commands:
      - tapOn: ".*로그아웃.*" # 설정의 로그아웃 행
      # MyPage.tsx의 Alert.alert(account.logoutTitle, ...) 확인 모달. 취소="취소" / 확인="확인".
      - extendedWaitUntil:
          visible: "확인"
          timeout: 5000
      - tapOn: "확인"
- assertVisible: ".*로그인하기.*" # 게스트 화면(settings.login)
